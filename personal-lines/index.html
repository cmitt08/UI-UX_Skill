<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#16243A" />
  <meta name="description" content="A complete interactive study course for the Florida 4-40 Customer Representative license — personal lines insurance lessons, quizzes, flashcards, and practice exams." />
  <title>Personal Lines Academy — Florida 4-40 Study Course</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Course navigation">
      <div class="brand">
        <div class="brand__mark" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg>
        </div>
        <div>
          <div class="brand__name">Personal Lines Academy</div>
          <div class="brand__sub">Florida 4-40 Prep</div>
        </div>
      </div>

      <div class="sidebar__progress">
        <div class="sidebar__progress-label">
          <span id="sideProgressCount">0 / 0 lessons</span>
          <strong id="sideProgressPct">0%</strong>
        </div>
        <div class="meter"><div class="meter__fill" id="sideProgressFill" style="width:0%"></div></div>
      </div>

      <nav class="nav" id="nav" aria-label="Course outline"></nav>
    </aside>

    <div class="overlay" id="overlay" aria-hidden="true"></div>

    <div class="main">
      <header class="topbar">
        <button class="topbar__menu" id="menuBtn" aria-label="Open course navigation">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="topbar__crumb" id="crumb"></div>
        <span class="pill" id="topPct"></span>
      </header>

      <main class="content" id="view"></main>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    /* Content registry — content files below push units into this. */
    window.PL = { units: [], finalExam: { questions: [] } };
  </script>
  <script src="js/content/unit1.js"></script>
  <script src="js/content/unit2.js"></script>
  <script src="js/content/unit3.js"></script>
  <script src="js/content/unit4.js"></script>
  <script src="js/content/unit5.js"></script>
  <script src="js/content/unit6.js"></script>
  <script src="js/content/unit7.js"></script>
  <script src="js/content/unit8.js"></script>
  <script src="js/content/unit9.js"></script>
  <script src="js/content/unit10.js"></script>
  <script src="js/content/finalexam.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
